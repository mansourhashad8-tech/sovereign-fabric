name: openness-and-security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Strict openness and vulnerability audit
        run: python -m sovereign audit --strict
      - name: Write disclosure report
        run: python -m sovereign disclosure
      - name: Write CycloneDX SBOM
        run: python -m sovereign sbom
      - name: Upload disclosure
        uses: actions/upload-artifact@v4
        with:
          name: disclosure
          path: |
            SECURITY_DISCLOSURE.md
            sbom.cdx.json
