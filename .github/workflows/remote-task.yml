name: sovereign-remote-task

on:
  workflow_dispatch:
    inputs:
      task:
        description: Bounded remote task
        required: true
        default: tests
        type: choice
        options:
          - tests
          - audit
          - both
      ref:
        description: Git ref to check out
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        if: ${{ inputs.task == 'tests' || inputs.task == 'both' }}
        run: python -m pytest
      - name: Strict audit
        if: ${{ inputs.task == 'audit' || inputs.task == 'both' }}
        run: python -m sovereign audit --strict
